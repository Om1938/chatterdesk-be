# HTTP — ACME challenge + redirect to HTTPS
# This file is always active. Nginx starts fine before certs exist.
server {
    listen 80;
    server_name chatter.ompdas.com;

    # Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
